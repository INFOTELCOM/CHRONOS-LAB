services:
  chronos-lab:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      CHRONOS_HOST: "0.0.0.0"
      CHRONOS_DATA_DIR: "/var/data"
      CHRONOS_ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
    volumes:
      - chronos-data:/var/data
    restart: unless-stopped
volumes:
  chronos-data:
