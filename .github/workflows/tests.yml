name: CHRONOS LAB quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Python syntax
        run: python -m py_compile app.py train_glyph_model.py audit_corpus.py evaluate_independent_glyphs.py
      - name: JavaScript syntax
        run: node --check app/static/app.js && node --check site/app.js && node --check site/v2.js && node --check site/v2-lab.js && node --check site/sw.js
      - name: Unit and API tests
        run: pytest -q
